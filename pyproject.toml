    "python-jose (>=3.5.0,<4.0.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "aiosmtplib (>=5.1.3,<6.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "aioboto3 (>=15.5.0,<16.0.0)",
